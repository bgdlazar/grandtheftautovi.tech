<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTA VI - Countdown</title>

  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=3">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Montserrat:wght@400;600;800;900&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon-pink: #ff2d87;
      --neon-cyan: #00e5ff;
      --card-bg: rgba(18, 12, 38, 0.65);
      --border-glow: rgba(255, 255, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0c0817;
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(ellipse at center, rgba(12, 8, 23, 0.2) 0%, rgba(12, 8, 23, 0.75) 100%),
        url('cocoteo-background.0~6dq9w0~ac7f.avif'),
        url('https://i.ibb.co/G4NHb1st/cocoteo-background-0-6dq9w0-ac7f.avif');
      background-size: cover;
      background-position: center;
      z-index: -2;
      filter: saturate(1.15) contrast(1.05);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 4px;
      z-index: -1;
      pointer-events: none;
      opacity: 0.45;
    }

    /* Buton Neon Vice City către Blog */
    .vice-blog-pill {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(18, 12, 38, 0.7);
      border: 1px solid rgba(255, 45, 135, 0.45);
      border-radius: 999px;
      text-decoration: none;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 45, 135, 0.2);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      user-select: none;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff2d87;
      box-shadow: 0 0 10px #ff2d87, 0 0 16px #ff2d87;
      animation: vicePulse 1.8s infinite ease-in-out;
    }

    @keyframes vicePulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.35);
        opacity: 0.5;
      }
    }

    .pill-tag {
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #00e5ff;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .pill-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .pill-arrow {
      color: #ff2d87;
      font-size: 14px;
      font-weight: 900;
      transition: transform 0.2s ease;
    }

    .vice-blog-pill:hover {
      background: rgba(28, 16, 56, 0.9);
      border-color: #00e5ff;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 229, 255, 0.45);
      transform: translateY(-2px);
    }

    .vice-blog-pill:hover .pill-arrow {
      color: #00e5ff;
      transform: translateX(4px);
    }

    /* Container Central */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 900px;
      width: 100%;
      z-index: 1;
    }

    .logo-container {
      margin-bottom: 25px;
      position: relative;
    }

    .logo-img {
      max-width: 240px;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 25px rgba(255, 45, 135, 0.6));
    }

    .tagline {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.6);
    }

    /* Grila Timer */
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 720px;
    }

    .timer-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glow);
      border-radius: 16px;
      padding: 24px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
    }

    .timer-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #ff2d87, #00e5ff);
    }

    .timer-num {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 54px;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
      margin-bottom: 8px;
    }

    .timer-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .vice-blog-pill {
        top: 14px;
        right: 14px;
        padding: 8px 14px;
        gap: 7px;
      }
      .pill-tag {
        display: none;
      }
      .pill-text {
        font-size: 10px;
        letter-spacing: 1px;
      }
      .timer-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .timer-num {
        font-size: 42px;
      }
      .logo-img {
        max-width: 190px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="scanlines"></div>

  <!-- Buton navigare către blog -->
  <a href="https://blog.grandtheftautovi.tech" class="vice-blog-pill" target="_self">
    <span class="pill-dot"></span>
    <span class="pill-tag">DISPATCH</span>
    <span class="pill-text">VICE WIRE BLOG</span>
    <span class="pill-arrow">→</span>
  </a>

  <div class="container">
    <div class="logo-container">
      <img src="vi.0hxa9~pf214xe.avif" alt="GTA VI Logo" class="logo-img" onerror="this.src='https://i.ibb.co/6R228x0M/vi-0hxa9-pf214xe.avif'">
    </div>

    <div class="tagline">COMING 2026 // COUNTDOWN TO VICE CITY</div>

    <div class="timer-grid">
      <div class="timer-card">
        <div class="timer-num" id="days">--</div>
        <div class="timer-label">Zile</div>
      </div>
      <div class="timer-card">
        <div class="timer-num" id="hours">--</div>
        <div class="timer-label">Ore</div>
      </div>
      <div class="timer-card">
        <div class="timer-num" id="minutes">--</div>
        <div class="timer-label">Minute</div>
      </div>
      <div class="timer-card">
        <div class="timer-num" id="seconds">--</div>
        <div class="timer-label">Secunde</div>
      </div>
    </div>
  </div>

  <script>
    // Data țintă: Toamna 2026 (17 Septembrie 2026)
    const targetDate = new Date("September 17, 2026 00:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, '0');
      document.getElementById("hours").innerText = String(hours).padStart(2, '0');
      document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
      document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
